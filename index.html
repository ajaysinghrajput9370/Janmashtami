<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Shri Krishna Janmashtami Mahotsav 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ===== RESET & VARIABLES ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Glassy Colors */
      --glass-bg: rgba(255, 255, 255, 0.15);
      --glass-border: rgba(255, 255, 255, 0.2);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      --glass-blur: blur(20px);
      
      /* Theme Colors - Krishna inspired */
      --primary: #1E5AA8;
      --primary-light: #4A7FC7;
      --primary-dark: #15407A;
      --accent: #2A9D8F;
      --accent-light: #4FB3A5;
      --saffron: #FF9933;
      --saffron-light: #FFB84D;
      --gold: #FFD700;
      
      /* Text Colors */
      --text-primary: #1A1A2E;
      --text-secondary: #4A4A6A;
      --text-light: #FFFFFF;
      --text-muted: rgba(255, 255, 255, 0.7);
      
      /* Background */
      --bg-start: #1E5AA8;
      --bg-end: #2A9D8F;
      
      /* Cards */
      --card-bg: rgba(255, 255, 255, 0.12);
      --card-border: rgba(255, 255, 255, 0.18);
      --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
    }

    /* ===== DARK MODE ===== */
    body.dark {
      --glass-bg: rgba(20, 20, 35, 0.6);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --card-bg: rgba(20, 20, 35, 0.5);
      --card-border: rgba(255, 255, 255, 0.06);
      --text-primary: #F0F0F5;
      --text-secondary: #B0B0C8;
      --bg-start: #0D1B3E;
      --bg-end: #1A4A4A;
    }

    /* ===== BASE ===== */
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
      padding: 0;
      margin: 0;
      transition: background 0.5s ease;
      overflow-x: hidden;
    }

    /* ===== GLASSY CONTAINER ===== */
    .glass-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
      position: relative;
    }

    /* ===== GLASS CARD ===== */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--card-shadow);
      transition: all 0.3s ease;
    }

    .glass-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
    }

    /* ===== LOADING ===== */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: opacity 0.6s, visibility 0.6s;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #loader i {
      font-size: 3.5rem;
      color: var(--gold);
      animation: spin 1s infinite linear;
    }

    #loader span {
      color: white;
      font-weight: 300;
      font-size: 1.1rem;
      letter-spacing: 2px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ===== SCROLL PROGRESS ===== */
    #scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--gold), var(--saffron), var(--accent-light));
      z-index: 999;
      width: 0%;
      transition: width 0.1s;
    }

    /* ===== NAVIGATION ===== */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--glass-border);
      padding: 12px 0;
      margin: 0 -16px 16px -16px;
      padding-left: 16px;
      padding-right: 16px;
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 480px;
      margin: 0 auto;
    }

    .nav-logo {
      font-weight: 700;
      font-size: 1.1rem;
      color: white;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-logo i {
      color: var(--gold);
      font-size: 1.2rem;
    }

    .nav-links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .nav-links a {
      color: white;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .nav-links a:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }

    .nav-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .dark-toggle {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dark-toggle:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: rotate(20deg);
    }

    /* ===== HERO SECTION ===== */
    .hero {
      text-align: center;
      padding: 20px 0 10px 0;
    }

    .hero-illustration {
      width: 120px;
      height: 120px;
      margin: 0 auto 16px;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.2), rgba(255, 153, 51, 0.1));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255, 215, 0, 0.3);
      box-shadow: 0 0 60px rgba(255, 215, 0, 0.1);
    }

    .hero-illustration i {
      font-size: 4.5rem;
      color: var(--gold);
      filter: drop-shadow(0 4px 20px rgba(255, 215, 0, 0.3));
    }

    .hero h1 {
      font-size: 2rem;
      font-weight: 700;
      color: white;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .hero h1 span {
      background: linear-gradient(135deg, var(--gold), var(--saffron));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      color: var(--text-muted);
      font-weight: 300;
      font-size: 0.95rem;
      max-width: 400px;
      margin: 0 auto 16px;
      line-height: 1.6;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--gold), var(--saffron));
      color: #1A1A2E;
      padding: 14px 40px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      box-shadow: 0 8px 24px rgba(255, 215, 0, 0.3);
      transition: all 0.3s ease;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .btn-primary:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 12px 32px rgba(255, 215, 0, 0.4);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    /* ===== COUNTDOWN ===== */
    .countdown {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 16px 0 8px;
      flex-wrap: wrap;
    }

    .countdown-item {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      padding: 10px 14px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      min-width: 60px;
      text-align: center;
    }

    .countdown-item span {
      font-weight: 700;
      font-size: 1.6rem;
      color: var(--gold);
      display: block;
    }

    .countdown-item small {
      font-weight: 300;
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ===== SECTION TITLES ===== */
    .section-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: white;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title i {
      color: var(--gold);
      font-size: 1.3rem;
    }

    /* ===== DONATION SECTION ===== */
    .donation-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .qr-placeholder {
      background: rgba(255, 255, 255, 0.05);
      border: 2px dashed rgba(255, 215, 0, 0.3);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
    }

    .qr-placeholder i {
      font-size: 4rem;
      color: var(--gold);
      opacity: 0.7;
    }

    .qr-placeholder span {
      color: var(--text-muted);
      font-size: 0.9rem;
      display: block;
      margin-top: 8px;
    }

    .upi-box {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 12px 0 8px;
      justify-content: center;
    }

    .upi-id {
      background: rgba(255, 255, 255, 0.1);
      padding: 8px 16px;
      border-radius: 30px;
      font-weight: 500;
      font-size: 0.95rem;
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 16px;
      border-radius: 30px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      color: white;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }

    .copy-btn:active {
      transform: scale(0.95);
    }

    .donation-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .donation-form input,
    .donation-form textarea {
      padding: 12px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.06);
      color: white;
      font-family: inherit;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .donation-form input::placeholder,
    .donation-form textarea::placeholder {
      color: var(--text-muted);
    }

    .donation-form input:focus,
    .donation-form textarea:focus {
      outline: none;
      border-color: var(--gold);
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.05);
    }

    .donation-form textarea {
      resize: vertical;
      min-height: 60px;
    }

    .donation-form .btn-primary {
      width: 100%;
      justify-content: center;
      margin-top: 4px;
    }

    /* ===== STATS ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat-item {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      padding: 12px 8px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
    }

    .stat-item strong {
      font-size: 1.3rem;
      color: var(--gold);
      display: block;
    }

    .stat-item span {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .progress-wrap {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 30px;
      height: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
      margin: 8px 0 4px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--gold), var(--saffron), var(--accent-light));
      border-radius: 30px;
      transition: width 0.6s ease;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    /* ===== DONOR WALL ===== */
    .donor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .donor-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 14px;
      transition: all 0.3s ease;
    }

    .donor-card:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.08);
    }

    .donor-card .name {
      font-weight: 600;
      color: white;
      font-size: 0.95rem;
    }

    .donor-card .amount {
      color: var(--gold);
      font-weight: 700;
      font-size: 1.1rem;
    }

    .donor-card .msg {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin: 4px 0;
      line-height: 1.3;
    }

    .donor-card .date {
      font-size: 0.65rem;
      opacity: 0.5;
      color: white;
    }

    .empty-donors {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-muted);
      padding: 20px;
      font-size: 0.9rem;
    }

    /* ===== GALLERY ===== */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .gallery-item {
      aspect-ratio: 1 / 1;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.3s ease;
      padding: 8px;
      text-align: center;
    }

    .gallery-item:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.1);
    }

    .gallery-item i {
      font-size: 1.8rem;
      color: var(--gold);
      margin-bottom: 4px;
    }

    .gallery-item span {
      font-size: 0.6rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* ===== EVENT LIST ===== */
    .event-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      list-style: none;
    }

    .event-list li {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: white;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .event-list li i {
      color: var(--gold);
      font-size: 0.9rem;
    }

    /* ===== CONTACT ===== */
    .contact-flex {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .contact-flex a {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      padding: 12px 16px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: white;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s ease;
      font-size: 0.9rem;
    }

    .contact-flex a:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateX(4px);
    }

    .contact-flex a i {
      width: 24px;
      text-align: center;
      font-size: 1.1rem;
    }

    .contact-flex a .fa-whatsapp {
      color: #25D366;
    }

    /* ===== FLOATING DONATE ===== */
    .floating-donate {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 50;
      background: linear-gradient(135deg, var(--gold), var(--saffron));
      color: #1A1A2E;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      box-shadow: 0 8px 32px rgba(255, 215, 0, 0.3);
      transition: all 0.3s ease;
      border: none;
      cursor: pointer;
      text-decoration: none;
    }

    .floating-donate:hover {
      transform: scale(1.1) translateY(-4px);
      box-shadow: 0 12px 40px rgba(255, 215, 0, 0.4);
    }

    .floating-donate:active {
      transform: scale(0.9);
    }

    /* ===== BACK TO TOP ===== */
    .back-top {
      position: fixed;
      bottom: 84px;
      right: 20px;
      z-index: 50;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid rgba(255, 255, 255, 0.15);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.2rem;
      transition: all 0.3s ease;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
    }

    .back-top.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .back-top:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-3px);
    }

    /* ===== CONFETTI ===== */
    .confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9998;
    }

    /* ===== FOOTER ===== */
    footer {
      padding: 20px 0;
      text-align: center;
      color: var(--text-muted);
      font-weight: 300;
      font-size: 0.85rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      margin-top: 20px;
    }

    footer i {
      color: #FF6B6B;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 380px) {
      .nav-links a {
        font-size: 0.65rem;
        padding: 3px 8px;
      }
      
      .hero h1 {
        font-size: 1.6rem;
      }
      
      .countdown-item {
        min-width: 50px;
        padding: 8px 10px;
      }
      
      .countdown-item span {
        font-size: 1.3rem;
      }
      
      .stats-grid {
        grid-template-columns: 1fr 1fr;
      }
      
      .donor-grid {
        grid-template-columns: 1fr;
      }
      
      .gallery-grid {
        grid-template-columns: repeat(3, 1fr);
      }
      
      .event-list {
        grid-template-columns: 1fr;
      }
    }

    @media (min-width: 481px) {
      .glass-container {
        max-width: 600px;
        padding: 24px;
      }
      
      nav {
        margin: 0 -24px 24px -24px;
        padding-left: 24px;
        padding-right: 24px;
      }
      
      .hero-illustration {
        width: 160px;
        height: 160px;
      }
      
      .hero-illustration i {
        font-size: 5.5rem;
      }
      
      .hero h1 {
        font-size: 2.8rem;
      }
    }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in {
      animation: fadeUp 0.6s ease forwards;
    }

    .fade-in-delay-1 {
      animation-delay: 0.1s;
    }
    .fade-in-delay-2 {
      animation-delay: 0.2s;
    }
    .fade-in-delay-3 {
      animation-delay: 0.3s;
    }
  </style>
</head>
<body>

  <!-- ===== LOADING ===== -->
  <div id="loader">
    <i class="fas fa-fan"></i>
    <span>जय श्री कृष्णा</span>
  </div>

  <!-- ===== SCROLL PROGRESS ===== -->
