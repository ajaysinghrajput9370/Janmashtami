<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Admin Panel – Janmashtami Donations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #FF6B35, #7B2FBE);
            background-attachment: fixed;
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 {
            font-size: 2rem; font-weight: 800;
            background: linear-gradient(135deg, #FFD700, #FFD700);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            margin-bottom: 4px;
        }
        .sub-title { color: rgba(255,255,255,0.7); font-size: 0.9rem; margin-bottom: 24px; }
        .stats-bar {
            display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px;
        }
        .stat-box {
            background: rgba(255,255,255,0.08); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.06); border-radius: 16px;
            padding: 14px 24px; flex: 1; min-width: 100px;
        }
        .stat-box .num { font-size: 1.6rem; font-weight: 700; color: #FFD700; }
        .stat-box .lbl { font-size: 0.7rem; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px; }

        .filters {
            display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px;
        }
        .filters select, .filters input {
            padding: 10px 16px; border-radius: 60px; border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.06); color: #fff; font-family: 'Poppins', sans-serif;
            font-size: 0.85rem; outline: none;
        }
        .filters select option { background: #1A0A2E; }
        .filters select:focus, .filters input:focus { border-color: rgba(255,215,0,0.2); }

        .table-wrapper { overflow-x: auto; }
        table {
            width: 100%; border-collapse: collapse; background: rgba(255,255,255,0.04);
            border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.04);
        }
        th {
            text-align: left; padding: 14px 16px; background: rgba(255,255,255,0.04);
            font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;
            color: rgba(255,255,255,0.5); border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        td {
            padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.03);
            font-size: 0.85rem; vertical-align: middle;
        }
        tr:hover { background: rgba(255,255,255,0.02); }

        .status-badge {
            padding: 3px 14px; border-radius: 60px; font-size: 0.7rem; font-weight: 600;
            display: inline-block;
        }
        .status-badge.pending { background: rgba(255,152,0,0.15); color: #FFB74D; }
        .status-badge.approved { background: rgba(76,175,80,0.15); color: #81C784; }
        .status-badge.rejected { background: rgba(244,67,54,0.12); color: #EF5350; }

        .btn-action {
            padding: 6px 16px; border-radius: 60px; border: none; font-family: 'Poppins', sans-serif;
            font-weight: 600; font-size: 0.7rem; cursor: pointer; transition: all 0.3s ease;
            margin-right: 6px;
        }
        .btn-action.approve { background: rgba(76,175,80,0.15); color: #81C784; }
        .btn-action.approve:hover { background: rgba(76,175,80,0.25); transform: scale(1.05); }
        .btn-action.reject { background: rgba(244,67,54,0.12); color: #EF5350; }
        .btn-action.reject:hover { background: rgba(244,67,54,0.22); transform: scale(1.05); }
        .btn-action.delete { background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.4); }
        .btn-action.delete:hover { background: rgba(244,67,54,0.12); color: #EF5350; }
        .btn-action.view-screenshot {
            background: rgba(255,215,0,0.08); color: #FFD700; font-size: 0.65rem;
        }
        .btn-action.view-screenshot:hover { background: rgba(255,215,0,0.16); transform: scale(1.05); }

        .screenshot-thumb {
            width: 40px; height: 40px; border-radius: 8px; object-fit: cover; cursor: pointer;
            border: 1px solid rgba(255,255,255,0.04); transition: 0.3s;
        }
        .screenshot-thumb:hover { transform: scale(1.1); }

        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); backdrop-filter: blur(20px);
            padding: 12px 28px; border-radius: 60px; border: 1px solid rgba(255,215,0,0.06);
            font-family: 'Poppins', sans-serif; font-weight: 500; font-size: 0.85rem;
            color: #fff; opacity: 0; transition: all 0.4s ease; pointer-events: none; z-index: 999;
        }
        .toast.show { opacity: 1; }

        .empty-state { text-align: center; padding: 40px; color: rgba(255,255,255,0.4); font-size: 0.9rem; }

        .back-link {
            display: inline-block; margin-bottom: 16px; color: #FFD700; text-decoration: none;
            font-weight: 500; transition: all 0.3s ease;
        }
        .back-link:hover { color: #FFD700; transform: translateX(-4px); }

        /* Lightbox for screenshot */
        .screenshot-lightbox {
            position: fixed; inset: 0; z-index: 9999;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(40px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
            padding: 20px;
        }
        .screenshot-lightbox.open { opacity: 1; pointer-events: auto; }
        .screenshot-lightbox img {
            max-width: 90%; max-height: 80vh; border-radius: 16px; box-shadow: 0 40px 100px rgba(0,0,0,0.8);
        }
        .screenshot-lightbox .close {
            position: absolute; top: 24px; right: 24px; width: 48px; height: 48px;
            border-radius: 50%; border: none; background: rgba(255,255,255,0.04);
            color: #fff; font-size: 1.6rem; cursor: pointer; transition: 0.3s;
        }
        .screenshot-lightbox .close:hover { background: rgba(255,255,255,0.08); transform: rotate(90deg); }

        @media (max-width: 600px) {
            .stats-bar { flex-direction: column; }
            th, td { padding: 10px 12px; font-size: 0.75rem; }
            .btn-action { padding: 4px 12px; font-size: 0.65rem; margin-bottom: 4px; }
            .screenshot-thumb { width: 30px; height: 30px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← होमपेज पर जाएँ</a>
        <h1>🙏 Admin Panel – Donations</h1>
        <p class="sub-title">सभी दान entries यहाँ दिखेंगी। Approve / Reject करें।</p>

        <div class="stats-bar" id="statsBar">
            <div class="stat-box"><div class="num" id="totalCount">0</div><div class="lbl">Total</div></div>
            <div class="stat-box"><div class="num" id="pendingCount">0</div><div class="lbl">⏳ Pending</div></div>
            <div class="stat-box"><div class="num" id="approvedCount">0</div><div class="lbl">✅ Approved</div></div>
            <div class="stat-box"><div class="num" id="rejectedCount">0</div><div class="lbl">❌ Rejected</div></div>
        </div>

        <div class="filters">
            <select id="statusFilter">
                <option value="all">All Status</option>
                <option value="pending">⏳ Pending</option>
                <option value="approved">✅ Approved</option>
                <option value="rejected">❌ Rejected</option>
            </select>
            <input type="text" id="searchInput" placeholder="🔍 Search name / mobile..." />
            <button class="btn-action approve" onclick="fetchDonations()" style="padding:10px 24px;font-size:0.85rem;background:rgba(255,215,0,0.08);color:#FFD700;">🔄 Refresh</button>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Mobile</th>
                        <th>Amount</th>
                        <th>Screenshot</th>
                        <th>Status</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="8" class="empty-state">⏳ Loading donations...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Screenshot Lightbox -->
    <div class="screenshot-lightbox" id="screenshotLightbox">
        <button class="close" onclick="closeScreenshot()">✕</button>
        <img src="" alt="Screenshot" id="screenshotViewer" />
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const API_BASE = window.location.origin + '/api';

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._hide);
            t._hide = setTimeout(() => t.classList.remove('show'), 3000);
        }

        async function fetchDonations() {
            try {
                const res = await fetch(API_BASE + '/admin/donations');
                if (!res.ok) throw new Error('Failed');
                const data = await res.json();
                renderTable(data);
                updateStats(data);
            } catch (e) {
                document.getElementById('tableBody').innerHTML =
                    `<tr><td colspan="8" style="text-align:center;color:#EF5350;padding:30px;">⚠️ सर्वर से कनेक्ट नहीं हो पाया</td></tr>`;
            }
        }

        function renderTable(donors) {
            const statusFilter = document.getElementById('statusFilter').value;
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();

            let filtered = donors;
            if (statusFilter !== 'all') {
                filtered = filtered.filter(d => d.status === statusFilter);
            }
            if (searchQuery) {
                filtered = filtered.filter(d =>
                    d.name.toLowerCase().includes(searchQuery) ||
                    d.mobile.includes(searchQuery)
                );
            }

            const tbody = document.getElementById('tableBody');
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="empty-state">कोई entry नहीं मिली।</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map((d, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td><strong>${d.name}</strong></td>
                    <td>${d.mobile}</td>
                    <td><strong style="color:#FFD700;">₹${d.amount}</strong></td>
                    <td>
                        ${d.screenshot ? `<img src="${d.screenshot}" class="screenshot-thumb" onclick="openScreenshot('${d.screenshot}')" />` : '<span style="color:rgba(255,255,255,0.3);font-size:0.7rem;">No</span>'}
                    </td>
                    <td><span class="status-badge ${d.status}">${d.status === 'pending' ? '⏳ Pending' : d.status === 'approved' ? '✅ Approved' : '❌ Rejected'}</span></td>
                    <td style="font-size:0.75rem;color:rgba(255,255,255,0.4);">${d.date}</td>
                    <td>
                        ${d.status === 'pending' ? `
                            <button class="btn-action approve" onclick="approveDonation(${d.id})">✅ Approve</button>
                            <button class="btn-action reject" onclick="rejectDonation(${d.id})">❌ Reject</button>
                        ` : `
                            <span style="font-size:0.7rem;color:rgba(255,255,255,0.3);">${d.status === 'approved' ? '✅ Done' : '❌ Done'}</span>
                        `}
                        <button class="btn-action delete" onclick="deleteDonation(${d.id})">🗑️</button>
                    </td>
                </tr>
            `).join('');
        }

        function updateStats(donors) {
            document.getElementById('totalCount').textContent = donors.length;
            document.getElementById('pendingCount').textContent = donors.filter(d => d.status === 'pending').length;
            document.getElementById('approvedCount').textContent = donors.filter(d => d.status === 'approved').length;
            document.getElementById('rejectedCount').textContent = donors.filter(d => d.status === 'rejected').length;
        }

        function openScreenshot(url) {
            document.getElementById('screenshotViewer').src = url;
            document.getElementById('screenshotLightbox').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeScreenshot() {
            document.getElementById('screenshotLightbox').classList.remove('open');
            document.body.style.overflow = '';
        }
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeScreenshot(); });

        async function approveDonation(id) {
            if (!confirm('✅ इस दान को Approve करें?')) return;
            try {
                const res = await fetch(`${API_BASE}/admin/approve/${id}`, { method: 'POST' });
                const data = await res.json();
                showToast(data.message || 'Approved ✅');
                fetchDonations();
            } catch (e) { showToast('Error!', true); }
        }

        async function rejectDonation(id) {
            if (!confirm('❌ इस दान को Reject करें?')) return;
            try {
                const res = await fetch(`${API_BASE}/admin/reject/${id}`, { method: 'POST' });
                const data = await res.json();
                showToast(data.message || 'Rejected ❌');
                fetchDonations();
            } catch (e) { showToast('Error!', true); }
        }

        async function deleteDonation(id) {
            if (!confirm('🗑️ इस दान को Delete करें? (यह हमेशा के लिए हट जाएगा)')) return;
            try {
                const res = await fetch(`${API_BASE}/admin/delete/${id}`, { method: 'DELETE' });
                const data = await res.json();
                showToast(data.message || 'Deleted 🗑️');
                fetchDonations();
            } catch (e) { showToast('Error!', true); }
        }

        document.getElementById('statusFilter').addEventListener('change', fetchDonations);
        document.getElementById('searchInput').addEventListener('input', fetchDonations);

        fetchDonations();
        setInterval(fetchDonations, 30000);
    </script>
</body>
</html>
